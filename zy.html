<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>椎名自用云盘官网</title>
<style>
:root{
  --gold:#C19A6B;
  --gold-deep:#8B5A2B;
  --ink:#6b4518;
  --ink-soft:#7a5836;
  --r-lg:22px;
  --r-md:15px;
  --r-sm:11px;
  --bg-img:url("https://cccimg.com/view.php/36fdf675926c3eae787de0952e64bf23.jpg");
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  overflow:hidden;
  position:fixed;
  inset:0;
  width:100%;
}
body{
  margin:0;
  color:var(--ink-soft);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",
              "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  touch-action:manipulation;
}

/* ===================== 背景 ===================== */
.bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background-color:#e8dcc9;
  background-image:
    radial-gradient(120% 85% at 50% 0%, rgba(255,250,240,.48), rgba(255,250,240,0) 62%),
    linear-gradient(180deg,
      rgba(255,255,255,.28) 0%,
      rgba(255,246,232,.16) 45%,
      rgba(176,136,96,.32) 100%),
    var(--bg-img);
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
}

/* ===================== 液态玻璃 ===================== */
.liquid{
  position:relative;
  border-radius:var(--r-lg);
  background:
    radial-gradient(130% 92% at 50% -22%, rgba(255,255,255,.74), rgba(255,255,255,.08) 62%),
    linear-gradient(162deg,
      rgba(255,255,255,.46) 0%,
      rgba(255,255,255,.15) 46%,
      rgba(255,255,255,.34) 100%);
  border:1px solid rgba(255,255,255,.62);
  backdrop-filter:saturate(185%) brightness(1.06);
  -webkit-backdrop-filter:saturate(185%) brightness(1.06);
  box-shadow:
    0 12px 30px rgba(80,55,25,.16),
    0 2px 5px rgba(80,55,25,.09),
    inset 0 2px 3px rgba(255,255,255,.96),
    inset 0 -4px 10px -6px rgba(255,255,255,.80),
    inset 4px 0 14px -10px rgba(255,255,255,1),
    inset -4px 0 14px -10px rgba(255,255,255,1);
}
.liquid::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:
    radial-gradient(56% 38% at 20% 2%,  rgba(255,255,255,.96), rgba(255,255,255,0) 66%),
    radial-gradient(34% 26% at 85% 9%,  rgba(255,255,255,.62), rgba(255,255,255,0) 72%),
    radial-gradient(84% 52% at 50% 114%, rgba(255,255,255,.48), rgba(255,255,255,0) 62%);
}
.liquid::after{
  content:"";
  position:absolute;
  left:16%; right:16%; bottom:2px;
  height:1.3px;
  border-radius:2px;
  pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.98), transparent);
}
.liquid > *{ position:relative; z-index:1; }

/* ===================== 布局 ===================== */
.app{
  position:relative;
  z-index:1;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(8px,1.6vh,16px);
  padding:clamp(10px,2.4vh,24px) 16px calc(88px + env(safe-area-inset-bottom,0px));
}

.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  text-align:center;
  flex:0 0 auto;
}
#mainTitle{
  margin:0;
  font-size:clamp(20px,3.6vw,34px);
  font-weight:800;
  letter-spacing:2px;
  background:linear-gradient(180deg,#eecb96 0%,#c9974f 48%,#a9762f 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:#c9974f;
  filter:drop-shadow(0 2px 5px rgba(90,60,20,.32))
         drop-shadow(0 1px 0 rgba(255,255,255,.5));
  line-height:1.15;
}
#authorInfo{
  margin:0;
  font-size:clamp(11px,1.4vw,13px);
  font-weight:600;
  letter-spacing:2px;
  color:#8a6a45;
  text-shadow:0 1px 0 rgba(255,255,255,.65), 0 3px 9px rgba(90,60,20,.16);
}
.time-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 14px;
  border-radius:999px;
  font-size:clamp(10px,1.2vw,11.5px);
  font-weight:700;
  letter-spacing:.4px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}
.time-chip::before{
  content:"";
  width:6px;height:6px;
  border-radius:50%;
  background:#7fc47f;
  box-shadow:0 0 7px rgba(110,190,110,.9);
  flex:0 0 auto;
}

/* ===================== 滑动面板 ===================== */
.panels{
  width:min(660px,100%);
  overflow:hidden;
  border-radius:var(--r-lg);
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
  flex:0 0 auto;
}
.panel-track{
  display:flex;
  flex-wrap:nowrap;
  align-items:flex-start;
  will-change:transform;
}
.panel{
  flex:0 0 100%;
  min-width:0;
  padding:2px;
}
.card{
  padding:clamp(14px,1.8vw,20px);
}
.card-title{
  margin:0 0 3px;
  font-size:clamp(13px,1.5vw,15.5px);
  font-weight:800;
  letter-spacing:1.5px;
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.card-sub{
  margin:0 0 12px;
  font-size:clamp(10px,1.1vw,11px);
  font-weight:600;
  letter-spacing:.6px;
  color:#9b7b55;
}

/* ===================== 主页入口 ===================== */
.actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(8px,1.2vw,12px);
}
.action-btn{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:clamp(11px,1.5vw,15px) 8px;
  border-radius:var(--r-md);
  overflow:hidden;
  text-decoration:none;
  font-size:clamp(12px,1.35vw,13.5px);
  font-weight:800;
  letter-spacing:2px;
  color:var(--gold-deep);
  border:1px solid rgba(255,255,255,.68);
  background:
    radial-gradient(120% 80% at 50% -18%, rgba(255,255,255,.82), rgba(255,255,255,.16) 62%),
    linear-gradient(150deg, rgba(255,255,255,.50), rgba(255,255,255,.20));
  backdrop-filter:saturate(180%) brightness(1.05);
  -webkit-backdrop-filter:saturate(180%) brightness(1.05);
  box-shadow:
    0 5px 14px rgba(120,85,45,.12),
    inset 0 2px 3px rgba(255,255,255,.96),
    inset 0 -3px 8px -5px rgba(255,255,255,.85);
  transition:transform .28s cubic-bezier(.34,1.5,.64,1),
             box-shadow .28s, background .28s, color .28s;
}
.action-btn svg{
  width:18px;height:18px;
  fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
  opacity:.92;
}
.action-btn::after{
  content:"";
  position:absolute;
  top:-60%; left:-130%;
  width:60%; height:220%;
  pointer-events:none;
  transform:rotate(18deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
  transition:left .65s ease;
}
.action-btn:hover{
  transform:translateY(-3px);
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% -18%, rgba(255,255,255,.95), rgba(255,255,255,.30) 62%),
    linear-gradient(150deg, rgba(255,247,235,.82), rgba(255,232,200,.52));
  box-shadow:
    0 10px 22px rgba(120,85,45,.20),
    inset 0 2px 3px rgba(255,255,255,1);
}
.action-btn:hover::after{ left:135%; }
.action-btn:active{ transform:translateY(-1px) scale(.98); }

/* ===================== 音乐区 ===================== */
.music-body{ display:block; }

.music-player-panel{ margin-bottom:0; }

.player{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}
.album{
  position:relative;
  flex:0 0 auto;
  width:clamp(44px,6.5vw,58px);
  aspect-ratio:1/1;
}
.album img{
  display:block;
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.88);
  box-shadow:
    0 5px 14px rgba(96,66,30,.26),
    0 0 0 1px rgba(193,154,107,.5);
  will-change:transform;
  background:#e8dcc9;
}
.album::after{
  content:"";
  position:absolute;
  inset:0;margin:auto;
  width:16%;height:16%;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle at 35% 30%, #fff, #e8d6bb 60%, var(--gold));
  box-shadow:0 0 0 1.5px rgba(255,255,255,.6), 0 2px 5px rgba(0,0,0,.22);
}
.meta{flex:1;min-width:0;}
.track-title{
  font-size:clamp(12.5px,1.5vw,14.5px);
  font-weight:800;
  color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}
.track-artist{
  margin-top:2px;
  font-size:clamp(10px,1.1vw,11px);
  font-weight:600;
  letter-spacing:.4px;
  color:#9b7b55;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#audioPlayer{
  display:block;
  width:100%;
  height:34px;
  margin-bottom:9px;
  border-radius:var(--r-sm);
  outline:none;
  filter:drop-shadow(0 3px 10px rgba(120,85,45,.18));
}
.player-actions{
  display:flex;
  gap:7px;
  margin-bottom:9px;
}
.ctrl{
  flex:1;
  padding:8px 0;
  border-radius:var(--r-sm);
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  letter-spacing:1.2px;
  color:var(--gold-deep);
  cursor:pointer;
  border:1px solid rgba(255,255,255,.68);
  background:
    radial-gradient(120% 80% at 50% -18%, rgba(255,255,255,.80), rgba(255,255,255,.18) 62%),
    linear-gradient(150deg, rgba(255,255,255,.46), rgba(255,255,255,.18));
  box-shadow:
    0 4px 11px rgba(120,85,45,.12),
    inset 0 2px 2px rgba(255,255,255,.95);
  transition:transform .2s, background .25s, color .25s, box-shadow .25s;
}
.ctrl:hover{
  transform:translateY(-2px);
  color:var(--ink);
  background:linear-gradient(150deg, rgba(255,244,228,.88), rgba(255,228,196,.55));
  box-shadow:0 7px 16px rgba(120,85,45,.16), inset 0 2px 2px rgba(255,255,255,1);
}
.ctrl:active{ transform:translateY(0) scale(.98); }
.ctrl.primary{
  color:var(--ink);
  background:linear-gradient(150deg, rgba(255,238,210,.88), rgba(242,210,166,.58));
}

.scan-row{
  display:flex;
  gap:7px;
  margin-bottom:9px;
}
.scan-btn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:8px 7px;
  border-radius:var(--r-sm);
  font-family:inherit;
  font-size:11.5px;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  color:#fff;
  border:1px solid rgba(255,255,255,.5);
  background:linear-gradient(160deg, #d8b184 0%, #c19a6b 46%, #a97f4e 100%);
  box-shadow:
    0 5px 13px rgba(140,100,55,.28),
    inset 0 2px 2px rgba(255,255,255,.55),
    inset 0 -3px 8px -5px rgba(80,50,20,.5);
  transition:transform .22s cubic-bezier(.34,1.5,.64,1), box-shadow .22s, filter .22s;
}
.scan-btn svg{
  width:12px;height:12px;
  fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
  flex:0 0 auto;
}
.scan-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.06);
  box-shadow:0 9px 18px rgba(140,100,55,.36),
             inset 0 2px 2px rgba(255,255,255,.6);
}
.scan-btn:active{ transform:translateY(-1px) scale(.985); }
.scan-btn.ghost{
  flex:0 0 auto;
  padding:8px 11px;
  color:var(--gold-deep);
  background:
    radial-gradient(120% 80% at 50% -18%, rgba(255,255,255,.80), rgba(255,255,255,.18) 62%),
    linear-gradient(150deg, rgba(255,255,255,.46), rgba(255,255,255,.18));
  box-shadow:0 4px 11px rgba(120,85,45,.12), inset 0 2px 2px rgba(255,255,255,.95);
}
.scan-btn.ghost:hover{ color:var(--ink); filter:none; }

.playlist{
  list-style:none;
  margin:0;
  padding:0 4px 0 0;
  max-height:170px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  scrollbar-width:thin;
  scrollbar-color:rgba(193,154,107,.55) transparent;
  overscroll-behavior:contain;
}
.playlist::-webkit-scrollbar{ width:5px; }
.playlist::-webkit-scrollbar-thumb{
  background:rgba(193,154,107,.55);
  border-radius:3px;
}
.track{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border-radius:var(--r-sm);
  cursor:pointer;
  font-size:11.5px;
  font-weight:600;
  color:var(--ink-soft);
  background:rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.40);
  transition:background .25s, transform .2s, color .25s, box-shadow .25s;
  flex:0 0 auto;
}
.track:hover{
  background:rgba(255,255,255,.46);
  transform:translateX(3px);
}
.track.playing{
  color:var(--ink);
  background:linear-gradient(120deg, rgba(255,241,217,.9), rgba(255,226,187,.6));
  border-color:rgba(255,255,255,.85);
  box-shadow:0 3px 9px rgba(120,85,45,.14), inset 0 1px 0 rgba(255,255,255,.95);
}
.track .idx{
  width:16px;
  text-align:center;
  opacity:.55;
  font-size:10.5px;
  font-variant-numeric:tabular-nums;
  flex:0 0 auto;
}
.track.playing .idx{ opacity:.9; }
.track .t-name{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.track .t-artist{
  font-size:10.5px;
  font-weight:500;
  opacity:.7;
  max-width:32%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  flex:0 0 auto;
}
.track .t-time{
  font-size:10.5px;
  opacity:.6;
  font-variant-numeric:tabular-nums;
  flex:0 0 auto;
}
.empty-tip{
  padding:16px 12px;
  text-align:center;
  font-size:11px;
  font-weight:600;
  letter-spacing:.4px;
  color:#9b7b55;
  border-radius:var(--r-sm);
  border:1.5px dashed rgba(193,154,107,.55);
  background:rgba(255,255,255,.16);
  line-height:1.6;
  flex:0 0 auto;
}
.count-tip{
  margin:0 0 5px;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.8px;
  color:#9b7b55;
  text-align:right;
  min-height:13px;
}

.panel.dragging .card{
  outline:2px dashed rgba(193,154,107,.8);
  outline-offset:-6px;
}

/* ===================== 底部 Dock ===================== */
.dock{
  position:fixed;
  left:50%;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  z-index:60;
  display:flex;
  width:min(240px,66vw);
  padding:6px;
  border-radius:999px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
.dock-pill{
  position:absolute;
  top:6px;
  left:6px;
  height:calc(100% - 12px);
  border-radius:999px;
  pointer-events:none;
  z-index:0;
  background:
    linear-gradient(168deg,
      rgba(146,140,134,.58) 0%,
      rgba(108,102,96,.40) 52%,
      rgba(132,126,120,.50) 100%);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.66),
    inset 0 -4px 10px -6px rgba(255,255,255,.65),
    0 5px 14px rgba(58,46,34,.24);
  transition:transform .5s cubic-bezier(.45,1.4,.45,1), opacity .16s ease;
}
.dock-pill.hidden{ opacity:0; }

.dock-btn{
  position:relative;
  z-index:1;
  flex:1;
  padding:9px 0;
  border:0;
  border-radius:999px;
  background:transparent;
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  letter-spacing:2.5px;
  color:#8a6a45;
  cursor:pointer;
  transition:color .3s, transform .15s, text-shadow .3s;
}
.dock-btn.active{
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.85);
}
.dock-btn:active{ transform:scale(.94); }

/* ===================== 放大镜 ===================== */
.loupe{
  position:fixed;
  left:0;
  top:0;
  z-index:70;
  border-radius:999px;
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  transform:scale(.86);
  transform-origin:center center;
  transition:opacity .14s ease, transform .18s cubic-bezier(.34,1.45,.64,1);
  border:2px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.06);
  box-shadow:
    0 14px 30px rgba(50,35,20,.32),
    0 4px 9px rgba(50,35,20,.18),
    inset 0 0 0 1px rgba(255,255,255,.5),
    inset 0 9px 20px -12px rgba(255,255,255,.95),
    inset 0 -8px 16px -12px rgba(255,255,255,.8);
  will-change:transform, opacity, left, top;
}
.loupe.show{ opacity:1; transform:scale(1); }

.loupe-layer{
  position:absolute;
  left:0;
  top:0;
  width:100vw;
  height:100vh;
  transform-origin:0 0;
  pointer-events:none;
  will-change:transform;
}
.loupe-bg{
  background-color:#e8dcc9;
  background-image:
    radial-gradient(120% 85% at 50% 0%, rgba(255,250,240,.48), rgba(255,250,240,0) 62%),
    linear-gradient(180deg,
      rgba(255,255,255,.28) 0%,
      rgba(255,246,232,.16) 45%,
      rgba(176,136,96,.32) 100%),
    var(--bg-img);
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
}
.loupe-ui{ background:transparent; }

.loupe-dock{
  position:absolute;
  display:flex;
  padding:6px;
  border-radius:999px;
  background:
    radial-gradient(130% 92% at 50% -22%, rgba(255,255,255,.74), rgba(255,255,255,.08) 62%),
    linear-gradient(162deg,
      rgba(255,255,255,.46) 0%,
      rgba(255,255,255,.15) 46%,
      rgba(255,255,255,.34) 100%);
  border:1px solid rgba(255,255,255,.62);
  box-shadow:
    0 12px 30px rgba(80,55,25,.16),
    0 2px 5px rgba(80,55,25,.09),
    inset 0 2px 3px rgba(255,255,255,.96),
    inset 0 -4px 10px -6px rgba(255,255,255,.80);
}
.loupe-dock-pill{
  position:absolute;
  top:6px;
  left:6px;
  height:calc(100% - 12px);
  border-radius:999px;
  pointer-events:none;
  background:
    linear-gradient(168deg,
      rgba(146,140,134,.58) 0%,
      rgba(108,102,96,.40) 52%,
      rgba(132,126,120,.50) 100%);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.66),
    inset 0 -4px 10px -6px rgba(255,255,255,.65);
  will-change:transform;
}
.loupe-dock-btn{
  position:relative;
  z-index:1;
  flex:1;
  padding:9px 0;
  text-align:center;
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  letter-spacing:2.5px;
  color:#8a6a45;
  white-space:nowrap;
}
.loupe-dock-btn.on{
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.loupe-shine{
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:
    radial-gradient(50% 60% at 22% 12%, rgba(255,255,255,.55), rgba(255,255,255,0) 68%),
    radial-gradient(40% 50% at 82% 82%, rgba(255,255,255,.28), rgba(255,255,255,0) 70%);
}

/* ===================== 提示 ===================== */
#copyToast{
  position:fixed;
  top:50%;left:50%;
  z-index:9999;
  padding:11px 24px;
  border-radius:15px;
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--ink);
  opacity:0;
  visibility:hidden;
  transform:translate(-50%,-50%) scale(.9);
  background:
    radial-gradient(130% 90% at 50% -20%, rgba(255,255,255,.9), rgba(255,255,255,.35) 62%),

<script>
/* ===================== 北京时间 ===================== */
const timeEl = document.getElementById('beijingTime');
function updateBeijingTime(){
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  const week = ['日','一','二','三','四','五','六'][now.getDay()];
  timeEl.textContent =
    `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())} ` +
    `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())} 星期${week}`;
}
updateBeijingTime();
setInterval(updateBeijingTime, 1000);

/* ===================== 通用提示 ===================== */
const toastEl = document.getElementById('copyToast');
let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2200);
}

/* ===================== 复制到剪贴板 ===================== */
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
function copyToClipboard(){
  const text = '666';   // ← 这里改成你要复制的密码
  const done = ()=> showToast('密码已复制');
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ legacyCopy(text); done(); });
  } else {
    legacyCopy(text);
    done();
  }
}

/* ===================== 面板 / Dock 基础 ===================== */
const panelsWrap = document.getElementById('panelsWrap');
const panelTrack = document.getElementById('panelTrack');
const panels     = Array.from(document.querySelectorAll('.panel'));
const dockEl     = document.getElementById('dock');
const dockBtns   = Array.from(document.querySelectorAll('.dock-btn'));
const dockPill   = document.getElementById('dockPill');

const loupe        = document.getElementById('loupe');
const loupeBg      = document.getElementById('loupeBg');
const loupeUi      = document.getElementById('loupeUi');
const loupeDock    = document.getElementById('loupeDock');
const loupeDockPill= document.getElementById('loupeDockPill');
const loupeDockBtns= Array.from(document.querySelectorAll('.loupe-dock-btn'));

let currentIndex = 0;
let panelSuppressClick = false;
let dockSuppressClick  = false;

function panelWidth(){ return panelsWrap.clientWidth; }

function applyTransform(px, animate){
  panelTrack.style.transition = animate
    ? 'transform .5s cubic-bezier(.22,1,.36,1)'
    : 'none';
  panelTrack.style.transform = `translate3d(${px}px,0,0)`;
}

let pillRect = { x:0, y:0, w:0, h:0 };

function layoutPill(){
  const r = dockEl.getBoundingClientRect();
  const innerW = r.width - 12;
  const w = innerW / dockBtns.length;
  dockPill.style.width = w + 'px';
  dockPill.style.transform = `translateX(${currentIndex * w}px)`;
  pillRect = { x: r.left + 6, y: r.top + 6, w, h: r.height - 12 };
}

function syncDock(){
  dockBtns.forEach((b,i)=>{
    const on = i === currentIndex;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  layoutPill();
}

function goTo(i, animate = true){
  currentIndex = Math.max(0, Math.min(panels.length - 1, i));
  applyTransform(-currentIndex * panelWidth(), animate);
  syncDock();
}

dockBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if (dockSuppressClick) return;
    goTo(Number(btn.dataset.index));
  });
});

/* ===================== 面板左右滑动 ===================== */
let pDrag = { id:null, x0:0, y0:0, baseX:0, axis:null, moved:false };

panelsWrap.addEventListener('pointerdown', e=>{
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pDrag.id = e.pointerId;
  pDrag.x0 = e.clientX;
  pDrag.y0 = e.clientY;
  pDrag.baseX = -currentIndex * panelWidth();
  pDrag.axis = null;
  pDrag.moved = false;
});

panelsWrap.addEventListener('pointermove', e=>{
  if (pDrag.id === null || e.pointerId !== pDrag.id) return;
  const dx = e.clientX - pDrag.x0;
  const dy = e.clientY - pDrag.y0;

  if (!pDrag.axis){
    if (Math.abs(dx) < 9 && Math.abs(dy) < 9) return;
    pDrag.axis = Math.abs(dx) > Math.abs(dy) * 1.15 ? 'x' : 'y';
    if (pDrag.axis === 'x'){
      try{ panelsWrap.setPointerCapture(pDrag.id); }catch(_){}
      panelTrack.style.transition = 'none';
    }
  }
  if (pDrag.axis !== 'x') return;

  e.preventDefault();
  pDrag.moved = true;

  const w = panelWidth();
  const min = -(panels.length - 1) * w;
  let x = pDrag.baseX + dx;
  if (x > 0)   x = x * 0.32;
  if (x < min) x = min + (x - min) * 0.32;

  panelTrack.style.transform = `translate3d(${x}px,0,0)`;
}, { passive:false });

function endPanelDrag(e){
  if (pDrag.id === null) return;
  if (e && e.pointerId !== pDrag.id) return;
  const id = pDrag.id;
  pDrag.id = null;

  if (pDrag.axis !== 'x'){ pDrag.axis = null; return; }
  pDrag.axis = null;

  const dx = (e ? e.clientX : pDrag.x0) - pDrag.x0;
  const w  = panelWidth();
  const threshold = Math.min(78, w * 0.18);

  let target = currentIndex;
  if (dx < -threshold && currentIndex < panels.length - 1) target = currentIndex + 1;
  else if (dx > threshold && currentIndex > 0)             target = currentIndex - 1;

  goTo(target, true);

  if (pDrag.moved){
    panelSuppressClick = true;
    setTimeout(()=> panelSuppressClick = false, 60);
  }
  try{ panelsWrap.releasePointerCapture(id); }catch(_){}
}
panelsWrap.addEventListener('pointerup', endPanelDrag);
panelsWrap.addEventListener('pointercancel', endPanelDrag);

document.addEventListener('click', e=>{
  if (panelSuppressClick){
    e.stopPropagation(); e.preventDefault();
    panelSuppressClick = false;
  }
}, true);

/* ===================== 放大镜 ===================== */
const LOUPE_MAG = 1.32;
const LOUPE_OVER_X = 10;
const LOUPE_OVER_Y = 10;

let loupeW = 0;
let loupeH = 0;
let loupeFixedY = 0;
let loupeLeftLimit = 0;
let loupeRightLimit = 0;

function applyLayerTransform(layer, lx, ly, cx, cy){
  layer.style.left = (-lx) + 'px';
  layer.style.top  = (-ly) + 'px';
  layer.style.transformOrigin = cx + 'px ' + cy + 'px';
  layer.style.transform = `scale(${LOUPE_MAG})`;
}

function updateLoupe(clientX){
  if (!loupeW) return;

  let lx = clientX - loupeW / 2;
  lx = Math.max(loupeLeftLimit, Math.min(loupeRightLimit, lx));

  loupe.style.left = lx + 'px';
  loupe.style.top  = loupeFixedY + 'px';

  const cx = lx + loupeW / 2;
  const cy = loupeFixedY + loupeH / 2;

  applyLayerTransform(loupeBg, lx, loupeFixedY, cx, cy);
  applyLayerTransform(loupeUi, lx, loupeFixedY, cx, cy);
}

function targetIndexAt(clientX){
  const r = dockEl.getBoundingClientRect();
  const inner = r.width - 12;
  const btnW = inner / dockBtns.length;
  const rel = clientX - (r.left + 6);
  return Math.max(0, Math.min(dockBtns.length - 1, Math.floor(rel / btnW)));
}

function setTarget(idx){
  dockBtns.forEach((b,i)=>{
    b.style.color = (i === idx) ? 'var(--ink)' : '';
    b.style.textShadow = (i === idx) ? '0 1px 0 rgba(255,255,255,.9)' : '';
  });
  loupeDockBtns.forEach((b,i)=>{
    b.classList.toggle('on', i === idx);
  });
  syncLoupeDockPill(idx);
}

function syncLoupeDockPill(idx){
  const innerW = dockEl.clientWidth - 12;
  const btnW = innerW / dockBtns.length;
  loupeDockPill.style.width = btnW + 'px';
  loupeDockPill.style.transform = `translateX(${idx * btnW}px)`;
}

function clearTargetHighlight(){
  dockBtns.forEach(b=>{ b.style.color = ''; b.style.textShadow = ''; });
  loupeDockBtns.forEach(b=> b.classList.remove('on'));
}

function hideRealPill(){
  dockPill.classList.add('hidden');
  dockPill.style.opacity = '0';
  dockPill.style.visibility = 'hidden';
}
function showRealPill(){
  dockPill.classList.remove('hidden');
  dockPill.style.opacity = '';
  dockPill.style.visibility = '';
}

/* ===================== Dock 长按 + 仅左右拖动 ===================== */
let pressTimer = null;
let dDrag = { id:null, active:false, startX:0, startY:0, target:0 };

dockEl.addEventListener('contextmenu', e=> e.preventDefault());

dockEl.addEventListener('pointerdown', e=>{
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (dDrag.active) return;

  dDrag.id = e.pointerId;
  dDrag.startX = e.clientX;
  dDrag.startY = e.clientY;
  dDrag.active = false;

  try{ dockEl.setPointerCapture(e.pointerId); }catch(_){}
  layoutPill();

  clearTimeout(pressTimer);
  pressTimer = setTimeout(()=>{
    if (dDrag.id !== e.pointerId) return;
    activateLoupe(e.clientX);
  }, 150);
});

dockEl.addEventListener('pointermove', e=>{
  if (dDrag.id === null || e.pointerId !== dDrag.id) return;

  if (!dDrag.active){
    const dist = Math.hypot(e.clientX - dDrag.startX, e.clientY - dDrag.startY);
    if (dist > 14){
      clearTimeout(pressTimer);
      dDrag.id = null;
      try{ dockEl.releasePointerCapture(e.pointerId); }catch(_){}
    }
    return;
  }

  e.preventDefault();
  updateLoupe(e.clientX);

  const idx = targetIndexAt(e.clientX);
  if (idx !== dDrag.target){
    dDrag.target = idx;
    setTarget(idx);
  }
}, { passive:false });

function endDockDrag(e){
  if (dDrag.id === null) return;
  if (e && e.pointerId !== dDrag.id) return;
  const id = dDrag.id;
  clearTimeout(pressTimer);
  dDrag.id = null;
  try{ dockEl.releasePointerCapture(id); }catch(_){}

  if (dDrag.active){
    dDrag.active = false;
    const target = dDrag.target;

    loupe.classList.remove('show');
    clearTargetHighlight();
    showRealPill();

    if (target !== currentIndex) goTo(target, true);
    else syncDock();

    dockSuppressClick = true;
    setTimeout(()=> dockSuppressClick = false, 80);
  }
}
dockEl.addEventListener('pointerup', endDockDrag);
dockEl.addEventListener('pointercancel', endDockDrag);

/* ---- 激活放大镜 ---- */
function activateLoupe(clientX){
  dDrag.active = true;

  const r = dockEl.getBoundingClientRect();

  loupeW = pillRect.w + LOUPE_OVER_X * 2;
  loupeH = pillRect.h + LOUPE_OVER_Y * 2;

  loupeFixedY = pillRect.y + pillRect.h / 2 - loupeH / 2;

  loupeLeftLimit  = r.left  + 2;
  loupeRightLimit = r.right - loupeW - 2;

  loupe.style.width  = loupeW + 'px';
  loupe.style.height = loupeH + 'px';

  loupeDock.style.left   = r.left + 'px';
  loupeDock.style.top    = r.top  + 'px';
  loupeDock.style.width  = r.width  + 'px';
  loupeDock.style.height = r.height + 'px';

  updateLoupe(clientX);

  loupe.classList.add('show');

  hideRealPill();

  dDrag.target = targetIndexAt(clientX);
  setTarget(dDrag.target);

  if (navigator.vibrate) navigator.vibrate(8);
}

/* 窗口尺寸变化 */
window.addEventListener('resize', ()=>{
  applyTransform(-currentIndex * panelWidth(), false);
  layoutPill();
});

goTo(0, false);
layoutPill();
window.addEventListener('load', layoutPill);

/* ===================== 本地音乐（文件夹扫描 + ID3） ===================== */
const DEFAULT_ART = "https://cccimg.com/view.php/10aa25188ab9ee48465f945395ee84c1.jpg";
const AUDIO_RE = /\.(mp3|flac|wav|m4a|aac|ogg|oga|opus|wma|ape|aiff?|m4b|weba|mp4)$/i;

const audioPlayer   = document.getElementById('audioPlayer');
const audioAvatar   = document.getElementById('audioAvatar');
const trackTitleEl  = document.getElementById('trackTitle');
const trackArtistEl = document.getElementById('trackArtist');
const playlistEl    = document.getElementById('playlistEl');
const countTip      = document.getElementById('countTip');
const prevButton    = document.getElementById('prevButton');
const nextButton    = document.getElementById('nextButton');
const scanDirBtn    = document.getElementById('scanDirBtn');
const scanFilesBtn  = document.getElementById('scanFilesBtn');
const clearBtn      = document.getElementById('clearBtn');
const fileInput     = document.getElementById('fileInput');
const dirInput      = document.getElementById('dirInput');
const musicPanel    = document.getElementById('music');

let playlist = [];
let currentTrack = 0;
let wasPlaying = false;
const seenKeys = new Set();

/* ---------- ID3 解析 ---------- */
const TD_CACHE = {};
function decoder(label){
  if (!(label in TD_CACHE)){
    try{ TD_CACHE[label] = new TextDecoder(label); }catch(_){ TD_CACHE[label] = null; }
  }
  return TD_CACHE[label];
}
function synchsafe(b, o){
  return ((b[o]&0x7f)<<21) | ((b[o+1]&0x7f)<<14) | ((b[o+2]&0x7f)<<7) | (b[o+3]&0x7f);
}
function u32(b, o){
  return ((b[o]<<24) | (b[o+1]<<16) | (b[o+2]<<8) | b[o+3]) >>> 0;
}
function decodeText(bytes, enc){
  try{
    if (enc === 1){
      if (bytes.length >= 2){
        if (bytes[0] === 0xFF && bytes[1] === 0xFE){
          const d = decoder('utf-16le'); return d ? d.decode(bytes.subarray(2)) : '';
        }
        if (bytes[0] === 0xFE && bytes[1] === 0xFF){
          const d = decoder('utf-16be'); return d ? d.decode(bytes.subarray(2)) : '';
        }
      }
      const d = decoder('utf-16le');
      return d ? d.decode(bytes) : '';
    }
    if (enc === 2){ const d = decoder('utf-16be'); return d ? d.decode(bytes) : ''; }
    if (enc === 3){ const d = decoder('utf-8');    return d ? d.decode(bytes) : ''; }
    const d = decoder('iso-8859-1');
    return d ? d.decode(bytes) : '';
  }catch(_){ return ''; }
}
function readTextFrame(data){
  if (!data.length) return '';
  const enc = data[0];
  return decodeText(data.subarray(1), enc).replace(/\u0000+$/,'').trim();
}
function readPictureFrame(data, isV2){
  const enc = data[0];
  let p = 1;
  let mime = '';
  if (isV2){
    let fmt = '';
    for (let i=0;i<3 && p+i<data.length;i++) fmt += String.fromCharCode(data[p+i]);
    p += 3;
    mime = /png/i.test(fmt) ? 'image/png' : 'image/jpeg';
  } else {
    const start = p;
    while (p < data.length && data[p] !== 0) p++;
    mime = decodeText(data.subarray(start, p), 0) || 'image/jpeg';
    p++;
  }
  p += 1;
  if (enc === 1 || enc === 2){
    while (p + 1 < data.length && !(data[p] === 0 && data[p+1] === 0)) p += 2;
    p += 2;
  } else {
    while (p < data.length && data[p] !== 0) p++;
    p += 1;
  }
  if (p >= data.length) return null;
  try{ return new Blob([data.subarray(p)], { type: mime || 'image/jpeg' }); }
  catch(_){ return null; }
}
function handleFrame(id, data, out){
  switch(id){
    case 'TIT2': case 'TT2':
      if (!out.title)  out.title  = readTextFrame(data); break;
    case 'TPE1': case 'TP1':
      if (!out.artist) out.artist = readTextFrame(data); break;
    case 'TALB': case 'TAL':
      if (!out.album)  out.album  = readTextFrame(data); break;
    case 'APIC': case 'PIC':
      if (!out.picture){
        try{ out.picture = readPictureFrame(data, id === 'PIC'); }catch(_){}
      }
      break;
  }
}
function parseID3v2(bytes, ver, flags, out){
  let off = 10;
  if (flags & 0x40){
    if (ver === 3){ const extSize = u32(bytes, off); off += 4 + extSize; }
    else if (ver === 4){ const extSize = synchsafe(bytes, off); off += extSize; }
    else return;
  }
  const idLen     = ver === 2 ? 3 : 4;
  const headerLen = ver === 2 ? 6 : 10;

  while (off + headerLen <= bytes.length){
    let id = '';
    let bad = false;
    for (let i=0;i<idLen;i++){
      const c = bytes[off+i];
      if (c === 0){ bad = true; break; }
      id += String.fromCharCode(c);
    }
    if (bad || !/^[A-Z0-9]+$/.test(id)) break;

    let size;
    if (ver === 2)      size = (bytes[off+3]<<16) | (bytes[off+4]<<8) | bytes[off+5];
    else if (ver === 4) size = synchsafe(bytes, off+4);
    else                size = u32(bytes, off+4);

    const fFlags = ver === 2 ? 0 : ((bytes[off+8]<<8) | bytes[off+9]);
    const dataStart = off + headerLen;
    if (size <= 0 || dataStart + size > bytes.length) break;

    let skip = false;
    if (ver >= 3){
      if (fFlags & 0x0040) skip = true;
      if (fFlags & 0x0008) skip = true;
      if (fFlags & 0x0004) skip = true;
    }
    if (!skip){
      let frame = bytes.subarray(dataStart, dataStart + size);
      if (ver === 4 && (fFlags & 0x0001) && frame.length >= 4) frame = frame.subarray(4);
      handleFrame(id, frame, out);
    }
    off = dataStart + size;
  }
}
async function parseTags(file){
  const out = { title:'', artist:'', album:'', picture:null };
  try{
    const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (head.length >= 10 && head[0]===0x49 && head[1]===0x44 && head[2]===0x33){
      const ver   = head[3];
      const flags = head[5];
      const size  = synchsafe(head, 6);
      const need  = Math.min(size + 10, 2 * 1024 * 1024);
      const buf   = new Uint8Array(await file.slice(0, need).arrayBuffer());
      parseID3v2(buf, ver, flags, out);
    }
    if ((!out.title || !out.artist) && file.size > 128){
      const tail = new Uint8Array(await file.slice(file.size - 128).arrayBuffer());
      if (tail[0]===0x54 && tail[1]===0x41 && tail[2]===0x47){
        const dec = decoder('iso-8859-1');
        if (dec){
          const get = (a,b)=> dec.decode(tail.subarray(a,b)).replace(/\u0000.*$/,'').trim();
          if (!out.title)  out.title  = get(3,33);
          if (!out.artist) out.artist = get(33,63);
          if (!out.album)  out.album  = get(63,93);
        }
      }
    }
  }catch(_){}
  return out;
}

/* ---------- 文件名兜底 ---------- */
function parseFileName(filename){
  let base = filename.replace(/\.[^.]+$/, '');
  base = base.replace(/^\s*\d{1,3}[\s._\-]+/, '');
  base = base.replace(/[_]+/g, ' ').trim();

  const parts = base.split(/\s+-\s+/);
  if (parts.length >= 2 && parts[0].trim()){
    return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() || base };
  }
  return { artist: '未知艺术家', title: base || filename };
}

/* ---------- 封面懒加载 ---------- */
function artworkOf(track){
  if (track.artUrl) return track.artUrl;
  if (track.artBlob){
    try{ track.artUrl = URL.createObjectURL(track.artBlob); return track.artUrl; }
    catch(_){}
  }
  return DEFAULT_ART;
}

/* ---------- 渲染 ---------- */
function fmtTime(s){
  if (!isFinite(s) || s <= 0) return '--:--';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function renderPlaylist(){
  playlistEl.innerHTML = '';

  if (!playlist.length){
    const li = document.createElement('li');
    li.className = 'empty-tip';
    li.innerHTML = '还没有音乐<br>点击「选择音乐文件夹」授权一个目录<br>或把音频文件拖到这里';
    playlistEl.appendChild(li);
    countTip.textContent = '';
    return;
  }

  countTip.textContent = `共 ${playlist.length} 首`;

  const frag = document.createDocumentFragment();
  playlist.forEach((song, i)=>{
    const li = document.createElement('li');
    li.className = 'track' + (i === currentTrack ? ' playing' : '');
    li.dataset.index = i;

    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = i + 1;

    const name = document.createElement('span');
    name.className = 't-name';
    name.textContent = song.title;
    name.title = song.title;

    const artist = document.createElement('span');
    artist.className = 't-artist';
    artist.textContent = song.artist;
    artist.title = song.artist;

    const time = document.createElement('span');
    time.className = 't-time';
    time.textContent = fmtTime(song.duration);

    li.append(idx, name, artist, time);
    song._li = li;
    frag.appendChild(li);
  });
  playlistEl.appendChild(frag);
}

function updateTrackRow(track){
  const li = track._li;
  if (!li) return;
  const n = li.querySelector('.t-name');
  const a = li.querySelector('.t-artist');
  const t = li.querySelector('.t-time');
  if (n){ n.textContent = track.title;  n.title = track.title; }
  if (a){ a.textContent = track.artist; a.title = track.artist; }
  if (t)  t.textContent = fmtTime(track.duration);
}

/* ---------- 时长探测 ---------- */
function probeDuration(track){
  const probe = new Audio();
  probe.preload = 'metadata';
  const done = ()=>{ try{ probe.removeAttribute('src'); }catch(_){} };

  probe.addEventListener('loadedmetadata', ()=>{
    track.duration = probe.duration;
    updateTrackRow(track);
    done();
  }, { once:true });

  probe.addEventListener('error', done, { once:true });
  try{ probe.src = track.url; }catch(_){ done(); }
}

/* ---------- 加载 / 播放 ---------- */
function loadTrack(index, autoplay){
  if (!playlist.length){
    audioPlayer.pause();
    audioPlayer.removeAttribute('src');
    try{ audioPlayer.load(); }catch(_){}
    trackTitleEl.textContent  = '未选择音乐';
    trackArtistEl.textContent = '选择一个文件夹开始播放';
    audioAvatar.src = DEFAULT_ART;
    resetRotation();
    renderPlaylist();
    return;
  }

  currentTrack = ((index % playlist.length) + playlist.length) % playlist.length;
  const song = playlist[currentTrack];

  audioPlayer.src = song.url;
  audioAvatar.src = artworkOf(song);
  trackTitleEl.textContent  = song.title;
  trackArtistEl.textContent = song.artist + (song.album ? ' · ' + song.album : '');

  resetRotation();
  renderPlaylist();

  if ('mediaSession' in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title : song.title,
        artist: song.artist,
        album : song.album || '',
        artwork:[{ src: artworkOf(song), sizes:'512x512', type:'image/jpeg' }]
      });
    }catch(_){}
  }

  if (autoplay){
    audioPlayer.play().catch(err=>{
      console.log('自动播放受限，请手动点击播放器', err);
    });
  }
}

/* ---------- 添加文件 ---------- */
async function addFiles(fileList){
  if (!fileList || !fileList.length) return;

  const files = Array.from(fileList).filter(f =>
    (f.type && f.type.startsWith('audio/')) || AUDIO_RE.test(f.name)
  );

  if (!files.length){ showToast('未找到音频文件'); return; }

  files.sort((a,b)=> a.name.localeCompare(b.name, 'zh-Hans-CN'));

  const fresh = [];
  files.forEach(f=>{
    const key = `${f.name}|${f.size}|${f.lastModified}`;
    if (seenKeys.has(key)) return;
    seenKeys.add(key);
    fresh.push(f);
  });

  if (!fresh.length){ showToast('这些音乐已在列表中'); return; }

  const wasEmpty = playlist.length === 0;
  const added = [];

  fresh.forEach(f=>{
    const meta = parseFileName(f.name);
    let url = '';
    try{ url = URL.createObjectURL(f); }catch(_){}
    if (!url) return;

    const track = {
      file: f, url,
      title: meta.title, artist: meta.artist, album: '',
      artBlob: null, artUrl: null,
      duration: 0, _li: null
    };
    playlist.push(track);
    added.push(track);
  });

  if (!added.length){ showToast('无法读取这些文件'); return; }

  if (wasEmpty) loadTrack(0, false);
  renderPlaylist();

  showToast(`正在读取 ${added.length} 首音乐信息…`);

  await runConcurrent(added, 4, async (track)=>{
    const tags = await parseTags(track.file);
    if (tags.title)  track.title  = tags.title;
    if (tags.artist) track.artist = tags.artist;
    if (tags.album)  track.album  = tags.album;
    if (tags.picture && !track.artBlob) track.artBlob = tags.picture;

    updateTrackRow(track);

    if (playlist[currentTrack] === track){
      trackTitleEl.textContent  = track.title;
      trackArtistEl.textContent = track.artist + (track.album ? ' · ' + track.album : '');
      audioAvatar.src = artworkOf(track);
    }
  });

  renderPlaylist();
  added.forEach(probeDuration);
  showToast(`已添加 ${added.length} 首本地音乐`);
}

async function runConcurrent(items, limit, fn){
  let i = 0;
  const n = Math.min(limit, items.length);
  const workers = Array.from({ length: n }, async ()=>{
    while (i < items.length){
      const idx = i++;
      try{ await fn(items[idx]); }catch(_){}
    }
  });
  await Promise.all(workers);
}

/* ---------- 文件夹扫描 ---------- */
const MAX_DEPTH = 6;

async function walkDirectory(dirHandle, out, depth){
  if (depth > MAX_DEPTH) return;
  let iter;
  try{ iter = dirHandle.values(); }catch(_){ return; }

  for await (const entry of iter){
    if (entry.kind === 'file'){
      if (AUDIO_RE.test(entry.name)){
        try{ out.push(await entry.getFile()); }catch(_){}
      }
    } else if (entry.kind === 'directory'){
      if (entry.name.startsWith('.')) continue;
      try{ await walkDirectory(entry, out, depth + 1); }catch(_){}
    }
  }
}

async function pickFolder(){
  if (!window.showDirectoryPicker){
    dirInput.click();
    return;
  }
  try{
    const dirHandle = await window.showDirectoryPicker({ mode:'read' });
    showToast('正在扫描文件夹…');
    const files = [];
    await walkDirectory(dirHandle, files, 0);
    if (!files.length){ showToast('该文件夹内未找到音频文件'); return; }
    await addFiles(files);
  }catch(err){
    if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
    console.warn(err);
    showToast('无法访问该文件夹');
  }
}

/* ---------- 事件绑定 ---------- */
scanDirBtn.addEventListener('click', pickFolder);
scanFilesBtn.addEventListener('click', ()=> fileInput.click());

fileInput.addEventListener('change', e=>{
  addFiles(e.target.files);
  e.target.value = '';
});
dirInput.addEventListener('change', e=>{
  addFiles(e.target.files);
  e.target.value = '';
});

clearBtn.addEventListener('click', ()=>{
  if (!playlist.length){ showToast('列表已经是空的'); return; }

  audioPlayer.pause();
  audioPlayer.removeAttribute('src');
  try{ audioPlayer.load(); }catch(_){}

  playlist.forEach(t=>{
    try{ URL.revokeObjectURL(t.url); }catch(_){}
    if (t.artUrl){ try{ URL.revokeObjectURL(t.artUrl); }catch(_){} }
  });

  playlist = [];
  seenKeys.clear();
  currentTrack = 0;

  resetRotation();
  loadTrack(0, false);
  showToast('已清空播放列表');
});

playlistEl.addEventListener('click', e=>{
  const li = e.target.closest('.track');
  if (!li || li.dataset.index === undefined) return;
  loadTrack(Number(li.dataset.index), true);
});

nextButton.addEventListener('click', ()=>{
  if (!playlist.length) return showToast('请先选择一个音乐文件夹');
  loadTrack(currentTrack + 1, true);
});
prevButton.addEventListener('click', ()=>{
  if (!playlist.length) return showToast('请先选择一个音乐文件夹');
  loadTrack(currentTrack - 1, true);
});

audioPlayer.addEventListener('play',  startRotation);
audioPlayer.addEventListener('pause', stopRotation);
audioPlayer.addEventListener('ended', ()=>{
  resetRotation();
  if (playlist.length) loadTrack(currentTrack + 1, true);
});

document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){
    wasPlaying = !audioPlayer.paused;
    audioPlayer.pause();
  } else if (wasPlaying && playlist.length){
    audioPlayer.play().catch(()=>{});
  }
});

/* 拖拽音频到音乐面板 */
['dragenter','dragover'].forEach(ev=>{
  musicPanel.addEventListener(ev, e=>{
    e.preventDefault();
    musicPanel.classList.add('dragging');
  });
});
['dragleave','drop'].forEach(ev=>{
  musicPanel.addEventListener(ev, e=>{
    e.preventDefault();
    if (ev === 'dragleave' && musicPanel.contains(e.relatedTarget)) return;
    musicPanel.classList.remove('dragging');
  });
});
musicPanel.addEventListener('drop', e=>{
  e.preventDefault();
  musicPanel.classList.remove('dragging');
  if (e.dataTransfer && e.dataTransfer.files){
    addFiles(e.dataTransfer.files);
  }
});

/* 媒体按键 */
if ('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('nexttrack', ()=>{
      if (playlist.length) loadTrack(currentTrack + 1, true);
    });
    navigator.mediaSession.setActionHandler('previoustrack', ()=>{
      if (playlist.length) loadTrack(currentTrack - 1, true);
    });
  }catch(_){}
}

/* ===================== 封面旋转 ===================== */
let rotationAngle = 0;
let rotating = false;
let lastFrame = 0;
const ROTATE_SPEED = 0.028;

function rotateLoop(ts){
  if (!rotating) return;
  if (!lastFrame) lastFrame = ts;
  const delta = ts - lastFrame;
  lastFrame = ts;
  rotationAngle = (rotationAngle + delta * ROTATE_SPEED) % 360;
  audioAvatar.style.transform = `rotate(${rotationAngle}deg)`;
  requestAnimationFrame(rotateLoop);
}
function startRotation(){
  if (rotating) return;
  rotating = true; lastFrame = 0;
  requestAnimationFrame(rotateLoop);
}
function stopRotation(){ rotating = false; }
function resetRotation(){
  rotating = false;
  rotationAngle = 0;
  audioAvatar.style.transform = 'rotate(0deg)';
}

/* 初始化空状态 */
loadTrack(0, false);
